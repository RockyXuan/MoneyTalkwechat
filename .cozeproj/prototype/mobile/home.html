  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

          <button class="category-item flex flex-col items-center gap-1 py-2.5 rounded-xl bg-surface-container border-2 border-transparent hover:bg-surface-container-high transition-colors" data-category="医疗">
            <i data-lucide="heart-pulse" class="w-5 h-5 text-on-surface-variant"></i>
            <span class="text-[10px] font-semibold text-on-surface-variant">医疗</span>
          </button>
          <!-- 分类-教育 -->
          <button class="category-item flex flex-col items-center gap-1 py-2.5 rounded-xl bg-surface-container border-2 border-transparent hover:bg-surface-container-high transition-colors" data-category="教育">
            <i data-lucide="book-open" class="w-5 h-5 text-on-surface-variant"></i>
            <span class="text-[10px] font-semibold text-on-surface-variant">教育</span>
          </button>
          <!-- 分类-居住 -->
          <button class="category-item flex flex-col items-center gap-1 py-2.5 rounded-xl bg-surface-container border-2 border-transparent hover:bg-surface-container-high transition-colors" data-category="居住">
            <i data-lucide="home" class="w-5 h-5 text-on-surface-variant"></i>
            <span class="text-[10px] font-semibold text-on-surface-variant">居住</span>
          </button>
          <!-- 分类-社交 -->
          <button class="category-item flex flex-col items-center gap-1 py-2.5 rounded-xl bg-surface-container border-2 border-transparent hover:bg-surface-container-high transition-colors" data-category="社交">
            <i data-lucide="users" class="w-5 h-5 text-on-surface-variant"></i>
            <span class="text-[10px] font-semibold text-on-surface-variant">社交</span>
          </button>
          <!-- 分类-宠物 -->
          <button class="category-item flex flex-col items-center gap-1 py-2.5 rounded-xl bg-surface-container border-2 border-transparent hover:bg-surface-container-high transition-colors" data-category="宠物">
            <i data-lucide="cat" class="w-5 h-5 text-on-surface-variant"></i>
            <span class="text-[10px] font-semibold text-on-surface-variant">宠物</span>
          </button>
          <!-- 分类-其他 -->
          <button class="category-item flex flex-col items-center gap-1 py-2.5 rounded-xl bg-surface-container border-2 border-transparent hover:bg-surface-container-high transition-colors" data-category="其他">
            <i data-lucide="more-horizontal" class="w-5 h-5 text-on-surface-variant"></i>
            <span class="text-[10px] font-semibold text-on-surface-variant">其他</span>
          </button>
        </div>

        <!-- 搜索 + 自定义分类 同行 -->
        <div class="flex items-center gap-2 mb-5">
          <div class="flex-1 relative">
            <i data-lucide="search" class="w-4 h-4 text-on-surface-variant absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="edit-category-search" type="text" placeholder="搜索分类"
              class="w-full bg-surface-container border-none rounded-xl pl-9 pr-4 py-2.5 text-sm
                     text-on-surface placeholder:text-on-surface-variant/50
                     focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors" />
          </div>
          <button id="btn-custom-category"
            class="bg-surface-container text-on-surface-variant py-2.5 px-4 rounded-xl text-sm font-semibold
                   hover:bg-surface-container-high active:scale-[0.98] transition-all inline-flex items-center gap-1">
            <i data-lucide="plus" class="w-4 h-4"></i>自定义
          </button>
        </div>

        <!-- 日期 + 完成编辑 同行 -->
        <div class="flex items-center gap-3">
          <div class="flex-1 flex items-center bg-surface-container rounded-xl px-4 py-3">
            <i data-lucide="calendar" class="w-4 h-4 text-on-surface-variant mr-2"></i>
            <span id="edit-date" class="text-sm text-on-surface">2026-01-15</span>
          </div>
          <button id="btn-save-edit"
            class="bg-primary text-on-primary py-3 px-6 rounded-xl text-base font-semibold
                   hover:opacity-90 active:scale-[0.98] transition-all">
            完成编辑
          </button>
        </div>
      </div>
    </div>

    <!-- @main-content:end -->
  </main>

  <script>
  $(function() {
    // === 导航辅助函数 ===
    function navPush(route) {
      console.log('[原型演示] PUSH 到: ' + route);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log('[原型演示] REPLACE 为: ' + route);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log('[原型演示] RESET 到: ' + route);
      window.location.href = route;
    }
    function navBack() {
      console.log('[原型演示] BACK 返回上一页');
      if(window.history.length > 1) window.history.back();
    }

    // === TabBar 导航 ===
    $('nav a, [aria-current="page"]').closest('div').find('a').on('click', function(e) {
      // TabBar 链接已由 href 处理
    });

    // === 日期模式切换 ===
    $('#btn-mode-date').on('click', function() {
      $(this).addClass('bg-primary text-on-primary').removeClass('text-on-surface-variant');
      $('#btn-mode-month').removeClass('bg-primary text-on-primary').addClass('text-on-surface-variant');
      $('#date-display').text('2026-01-15');
    });
    $('#btn-mode-month').on('click', function() {
      $(this).addClass('bg-primary text-on-primary').removeClass('text-on-surface-variant');
      $('#btn-mode-date').removeClass('bg-primary text-on-primary').addClass('text-on-surface-variant');
      $('#date-display').text('2026年1月');
    });

    // === 智能解析按钮 ===
    $('#btn-parse').on('click', function() {
      // 复杂交互 - 实际应实现：
      // 1. 获取输入框文本内容
      // 2. 调用 AI 解析接口，传入文本和日期
      // 3. 解析返回后，渲染解析结果列表
      // 4. 滚动到解析结果区域
      console.log('[原型演示] 智能解析：', $('#input-text').val());
      // 原型中数据已硬编码，点击后滚动到解析结果
      $('html, body').animate({ scrollTop: $('#parse-result-section').offset().top - 20 }, 400);
    });

    // === 收集箱折叠/展开 ===
    var inboxExpanded = true;
    $('#inbox-header').on('click', function() {
      inboxExpanded = !inboxExpanded;
      if (inboxExpanded) {
        $('#inbox-list').slideDown(250);
        $('#inbox-chevron').css('transform', 'rotate(0deg)');
      } else {
        $('#inbox-list').slideUp(250);
        $('#inbox-chevron').css('transform', 'rotate(-90deg)');
      }
    });

    // === 收集箱单条确认 ===
    function updateInboxBadge() {
      var count = $('#inbox-list .bg-surface').length;
      if (count > 0) {
        $('#inbox-badge').text(count).show();
        $('#inbox-actions').show();
        $('#inbox-empty').addClass('hidden');
        $('#inbox-list').removeClass('hidden');
      } else {
        $('#inbox-badge').hide();
        $('#inbox-actions').hide();
        $('#inbox-empty').removeClass('hidden');
        $('#inbox-list').addClass('hidden');
      }
    }

    $('#btn-confirm-inbox-1').on('click', function(e) {
      e.stopPropagation();
      // 实际应调用 POST /api/records 确认该条记录为正式支出
      console.log('[原型演示] 确认收集箱记录: inbox-item-1');
      $('#inbox-item-1').animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300, function() {
        $(this).remove();
        updateInboxBadge();
      });
    });

    $('#btn-confirm-inbox-2').on('click', function(e) {
      e.stopPropagation();
      console.log('[原型演示] 确认收集箱记录: inbox-item-2');
      $('#inbox-item-2').animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300, function() {
        $(this).remove();
        updateInboxBadge();
      });
    });

    $('#btn-confirm-inbox-3').on('click', function(e) {
      e.stopPropagation();
      console.log('[原型演示] 确认收集箱记录: inbox-item-3');
      $('#inbox-item-3').animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300, function() {
        $(this).remove();
        updateInboxBadge();
      });
    });

    // === 收集箱单条删除 ===
    $('#btn-delete-inbox-1').on('click', function(e) {
      e.stopPropagation();
      console.log('[原型演示] 删除收集箱记录: inbox-item-1');
      $('#inbox-item-1').animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300, function() {
        $(this).remove();
        updateInboxBadge();
      });
    });

    $('#btn-delete-inbox-2').on('click', function(e) {
      e.stopPropagation();
      console.log('[原型演示] 删除收集箱记录: inbox-item-2');
      $('#inbox-item-2').animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300, function() {
        $(this).remove();
        updateInboxBadge();
      });
    });

    $('#btn-delete-inbox-3').on('click', function(e) {
      e.stopPropagation();
      console.log('[原型演示] 删除收集箱记录: inbox-item-3');
      $('#inbox-item-3').animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300, function() {
        $(this).remove();
        updateInboxBadge();
      });
    });

    // === 全部确认 ===
    $('#btn-confirm-all').on('click', function() {
      // 实际应调用批量确认接口
      console.log('[原型演示] 全部确认收集箱记录');
      $('#inbox-list .bg-surface').each(function() {
        $(this).animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300);
      });
      setTimeout(function() {
        $('#inbox-list .bg-surface').remove();
        updateInboxBadge();
      }, 400);
    });

    // === 清空收集箱 ===
    $('#btn-clear-inbox').on('click', function() {
      // 实际应调用批量删除接口
      console.log('[原型演示] 清空收集箱');
      $('#inbox-list .bg-surface').each(function() {
        $(this).animate({ opacity: 0, height: 0, marginBottom: 0, padding: 0 }, 300);
      });
      setTimeout(function() {
        $('#inbox-list .bg-surface').remove();
        updateInboxBadge();
      }, 400);
    });

    // === 编辑弹窗 ===
    function openEditModal(name, amount, category, date) {
      $('#edit-name').val(name);
      $('#edit-amount').val(amount);
      $('#edit-date').text(date);
      // 重置分类选中状态
      $('#category-grid .category-item').each(function() {
        var cat = $(this).data('category');
        if (cat === category) {
          $(this).addClass('bg-primary/10 border-primary').removeClass('bg-surface-container border-transparent');
          $(this).find('i, span').addClass('text-primary').removeClass('text-on-surface-variant');
        } else {
          $(this).removeClass('bg-primary/10 border-primary').addClass('bg-surface-container border-transparent');
          $(this).find('i, span').removeClass('text-primary').addClass('text-on-surface-variant');
        }
      });
      $('#edit-modal').removeClass('hidden');
    }

    // 解析结果的编辑按钮
    $('#btn-edit-0').on('click', function() {
      openEditModal('早饭', '20', '餐饮', '2026-01-15');
    });
    $('#btn-edit-1').on('click', function() {
      openEditModal('中饭', '30', '餐饮', '2026-01-15');
    });
    $('#btn-edit-2').on('click', function() {
      openEditModal('晚饭', '10', '餐饮', '2026-01-15');
    });
    $('#btn-edit-3').on('click', function() {
      openEditModal('电话费', '30', '通讯', '2026-01-15');
    });

    // 关闭弹窗
    $('#btn-close-modal').on('click', function() {
      $('#edit-modal').addClass('hidden');
    });
    // 点击遮罩关闭
    $('#edit-modal').on('click', function(e) {
      if ($(e.target).is('#edit-modal')) {
        $('#edit-modal').addClass('hidden');
      }
    });

    // 分类网格选择
    $('#category-grid').on('click', '.category-item', function() {
      // 取消其他选中
      $('#category-grid .category-item').each(function() {
        $(this).removeClass('bg-primary/10 border-primary').addClass('bg-surface-container border-transparent');
        $(this).find('i, span').removeClass('text-primary').addClass('text-on-surface-variant');
      });
      // 设置当前选中
      $(this).addClass('bg-primary/10 border-primary').removeClass('bg-surface-container border-transparent');
      $(this).find('i, span').addClass('text-primary').removeClass('text-on-surface-variant');
      console.log('[原型演示] 选择分类: ' + $(this).data('category'));
    });

    // 自定义分类按钮
    $('#btn-custom-category').on('click', function() {
      // 复杂交互 - 实际应实现：
      // 1. 弹出内联输入框，让用户输入自定义分类名称
      // 2. 选择一个 lucide 图标作为分类图标
      // 3. 将新分类添加到分类网格中
      // 4. 自动选中新添加的分类
      console.log('[原型演示] 自定义分类 - 应弹出输入框让用户创建新分类');
    });

    // 完成编辑
    $('#btn-save-edit').on('click', function() {
      // 复杂交互 - 实际应实现：
      // 1. 读取修改后的名称、金额、分类、日期
      // 2. 校验金额是否为有效数字
      // 3. 更新对应的解析结果卡片数据
      // 4. 重新计算合计金额
      // 5. 关闭弹窗
      console.log('[原型演示] 完成编辑 - 应保存修改并更新对应解析结果卡片');
      $('#edit-modal').addClass('hidden');
    });

    // === 底部操作栏 ===
    $('#btn-confirm-record').on('click', function() {
      // 实际应实现：
      // 1. 获取所有解析结果数据
      // 2. 调用 POST /api/records/batch 批量创建正式记录
      // 3. 成功后清空解析结果和输入框
      // 4. 显示成功提示 toast
      console.log('[原型演示] 确认记账 - 应批量保存解析结果为正式记录');
      // 原型中简单隐藏解析结果
      $('#parse-result-section').slideUp(300);
    });

    $('#btn-clear-results').on('click', function() {
      console.log('[原型演示] 清空结果');
      $('#parse-result-section').slideUp(300);
    });

    // 初始化收集箱 badge
    updateInboxBadge();
  });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
