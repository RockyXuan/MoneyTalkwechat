<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #2F7BFF;
      --color-primary-container:    #E8F0FE;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #F5F7FB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F0F2F5;
      --color-surface-container-high:     #E8EAED;
      --color-surface-container-highest:  #DEE1E6;
      /* === 文字 === */
      --color-on-surface:           #1A1A1A;
      --color-on-surface-variant:   #8A8A8A;
      /* === 功能色 === */
      --color-success:  #34C759;
      --color-error:    #FF3B30;
      --color-warning:  #FF9500;
      /* === 边框 === */
      --color-outline:          #E8E8E8;
      --color-outline-variant:  #F0F2F5;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 12px rgba(0,0,0,0.06);
      --shadow-float:  0 8px 24px rgba(0,0,0,0.1);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.15);
      /* === 字体 === */
      --font-sans: "PingFang SC", system-ui, -apple-system, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
    /* 隐藏横向滚动条 */
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <!-- 浮动 TabBar -->
  <nav class="fixed bottom-4 left-3 right-3 z-50">
    <div class="bg-white rounded-2xl shadow-float flex items-center justify-around py-2 px-2">
      <a href="home.html" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-primary bg-primary-container" aria-current="page">
        <i data-lucide="pen-line" class="w-5 h-5"></i>
        <span class="text-xs font-medium">记一笔</span>
      </a>
      <a href="subscriptions.html" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="credit-card" class="w-5 h-5"></i>
        <span class="text-xs">订阅</span>
      </a>
      <a href="bills.html" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="receipt" class="w-5 h-5"></i>
        <span class="text-xs">账单</span>
      </a>
      <a href="stats.html" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="chart-no-axes-column" class="w-5 h-5"></i>
        <span class="text-xs">统计</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-xs">我的</span>
      </a>
    </div>
  </nav>
  <!-- @nav:end 导航组件 -->

  <main class="flex-1 pb-24">
    <!-- @main-content:start -->

    <!-- 1. 顶部导航栏 -->
    <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-5">
      <h1 class="text-lg font-bold text-on-surface" style="font-size:18px;">记一笔</h1>
      <button id="btn-more" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors">
        <i data-lucide="ellipsis" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- 2. 日期选择 -->
    <div id="date-selector" class="flex items-center justify-center gap-4 py-2 px-5">
      <button id="btn-date-prev" class="w-8 h-8 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container transition-colors">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <span id="date-display" class="text-sm text-on-surface-variant font-medium">5月14日 周三</span>
      <button id="btn-date-next" class="w-8 h-8 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container transition-colors">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 3. 金额显示区 -->
    <div class="px-5 pt-2 pb-1">
      <div class="flex items-baseline gap-1">
        <span class="text-2xl font-bold text-on-surface">¥</span>
        <span id="amount-display" class="font-bold text-on-surface" style="font-size:38px;">0.00</span>
      </div>
      <div class="mt-2 border-b border-outline-variant/30"></div>
    </div>

    <!-- 4. 分类选择芯片 -->
    <div class="px-5 pt-4">
      <div id="category-chips" class="chip-scroll flex gap-2 overflow-x-auto pb-2">
        <!-- 分类-餐饮 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-primary text-white border-primary" data-category="餐饮">
          <span>🍔</span><span>餐饮</span>
        </button>
        <!-- 分类-交通 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="交通">
          <span>🚗</span><span>交通</span>
        </button>
        <!-- 分类-购物 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="购物">
          <span>🛒</span><span>购物</span>
        </button>
        <!-- 分类-住房 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="住房">
          <span>🏠</span><span>住房</span>
        </button>
        <!-- 分类-娱乐 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="娱乐">
          <span>🎮</span><span>娱乐</span>
        </button>
        <!-- 分类-医疗 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="医疗">
          <span>💊</span><span>医疗</span>
        </button>
        <!-- 分类-教育 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="教育">
          <span>📚</span><span>教育</span>
        </button>
        <!-- 分类-服饰 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="服饰">
          <span>👕</span><span>服饰</span>
        </button>
        <!-- 分类-其他 -->
        <button class="category-chip flex-shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium border transition-colors bg-white text-on-surface-variant border-outline-variant/30" data-category="其他">
          <span>💡</span><span>其他</span>
        </button>
        <!-- 添加分类按钮 -->
        <button id="btn-add-category" class="flex-shrink-0 flex items-center gap-1 px-3.5 py-2 rounded-full text-sm font-medium border border-dashed border-outline-variant/40 text-on-surface-variant bg-white transition-colors hover:border-primary hover:text-primary">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 5. 备注输入 -->
    <div class="px-5 pt-4">
      <input id="input-remark" type="text" class="w-full bg-surface-container border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors" placeholder="点击添加备注..." />
    </div>

    <!-- 6. 日期行 -->
    <div id="date-row" class="flex items-center gap-2 px-5 pt-4">
      <i data-lucide="calendar" class="w-4 h-4 text-on-surface-variant"></i>
      <span class="text-sm text-on-surface-variant">2024年5月14日</span>
    </div>

    <!-- 7. 保存按钮 -->
    <div class="px-5 pt-5">
      <button id="btn-save" class="w-full bg-primary text-on-primary py-3.5 rounded-xl text-base font-semibold hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
        保存
      </button>
    </div>

    <!-- 8. 最近记录区域 -->
    <div class="px-5 pt-8">
      <!-- 标题行 -->
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-on-surface">最近记录</h2>
        <a id="link-view-all" href="bills.html" class="text-xs text-on-surface-variant flex items-center gap-0.5 hover:text-primary transition-colors">
          查看全部<i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </a>
      </div>

      <!-- 记录列表 -->
      <div id="recent-records" class="bg-surface rounded-xl shadow-card overflow-hidden">
        <!-- 记录-1 -->
        <div class="record-item flex items-center px-4 py-3 border-b border-outline-variant/15" data-id="rec-1">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <span class="text-lg">🍔</span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-on-surface truncate">午餐 - 沙县小吃</p>
            </div>
          </div>
          <div class="flex flex-col items-end ml-3">
            <span class="text-sm font-semibold text-error">-¥25.00</span>
            <span class="text-xs text-on-surface-variant">5月14日</span>
          </div>
        </div>
        <!-- 记录-2 -->
        <div class="record-item flex items-center px-4 py-3 border-b border-outline-variant/15" data-id="rec-2">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <span class="text-lg">🚗</span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-on-surface truncate">地铁通勤</p>
            </div>
          </div>
          <div class="flex flex-col items-end ml-3">
            <span class="text-sm font-semibold text-error">-¥6.00</span>
            <span class="text-xs text-on-surface-variant">5月14日</span>
          </div>
        </div>
        <!-- 记录-3 -->
        <div class="record-item flex items-center px-4 py-3 border-b border-outline-variant/15" data-id="rec-3">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <span class="text-lg">🛒</span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-on-surface truncate">超市采购 - 水果蔬菜</p>
            </div>
          </div>
          <div class="flex flex-col items-end ml-3">
            <span class="text-sm font-semibold text-error">-¥68.50</span>
            <span class="text-xs text-on-surface-variant">5月13日</span>
          </div>
        </div>
        <!-- 记录-4 -->
        <div class="record-item flex items-center px-4 py-3" data-id="rec-4">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <span class="text-lg">🎮</span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-on-surface truncate">游戏会员续费</p>
            </div>
          </div>
          <div class="flex flex-col items-end ml-3">
            <span class="text-sm font-semibold text-error">-¥30.00</span>
            <span class="text-xs text-on-surface-variant">5月12日</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 9. 底部两个辅助卡片横排 -->
    <div class="px-5 pt-5 flex gap-3">
      <!-- 智能记账卡片 -->
      <div id="card-smart" class="flex-1 bg-surface rounded-xl shadow-card p-4 flex flex-col items-center justify-center gap-2">
        <div class="w-10 h-10 bg-primary-container rounded-full flex items-center justify-center">
          <i data-lucide="sparkles" class="w-5 h-5 text-primary"></i>
        </div>
        <span class="text-sm font-semibold text-on-surface">智能记账</span>
        <span class="text-xs text-on-surface-variant text-center">AI一句话记账</span>
      </div>
      <!-- 收集箱卡片 -->
      <div id="card-inbox" class="flex-1 bg-surface rounded-xl shadow-card p-4 flex flex-col items-center justify-center gap-2">
        <div class="w-10 h-10 bg-primary-container rounded-full flex items-center justify-center relative">
          <i data-lucide="inbox" class="w-5 h-5 text-primary"></i>
          <!-- 待确认数量角标 -->
          <span class="absolute -top-1 -right-1 bg-error text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full">3</span>
        </div>
        <span class="text-sm font-semibold text-on-surface">收集箱</span>
        <span class="text-xs text-on-surface-variant text-center">3条待确认</span>
      </div>
    </div>

    <!-- 10. AI提示条 -->
    <div id="ai-tip" class="mx-5 mt-4 mb-4 bg-primary-container rounded-xl px-4 py-3 flex items-center gap-2.5">
      <i data-lucide="lightbulb" class="w-4 h-4 text-primary flex-shrink-0"></i>
      <p class="text-xs text-primary font-medium">最近餐饮支出偏高，建议控制外卖频次，本周已超预算28%</p>
    </div>

    <!-- @main-content:end -->
  </main>

  <script>
    // 导航辅助函数
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    $(function () {
      // 分类芯片点击切换
      $('#category-chips').on('click', '.category-chip', function () {
        // 取消所有芯片的选中态
        $('.category-chip').removeClass('bg-primary text-white border-primary').addClass('bg-white text-on-surface-variant border-outline-variant/30');
        // 设置当前芯片为选中态
        $(this).removeClass('bg-white text-on-surface-variant border-outline-variant/30').addClass('bg-primary text-white border-primary');
      });

      // 添加分类按钮
      // 点击后应实现：
      // 1. 弹出底部模态框，显示分类名称输入框和emoji选择器
      // 2. 用户输入分类名称并选择emoji后，点击确认
      // 3. 在芯片列表末尾（+按钮前）插入新的分类芯片
      // 4. 新芯片默认为未选中状态
      $('#btn-add-category').on('click', function () {
        console.log('[原型演示] 添加新分类 - 应弹出分类编辑模态框');
      });

      // 保存按钮
      // 点击后应实现：
      // 1. 收集当前选中的分类、备注内容、日期、金额
      // 2. 验证金额是否已输入（大于0）
      // 3. 如金额为0，显示提示"请输入金额"
      // 4. 保存成功后，将记录添加到最近记录列表顶部
      // 5. 重置金额显示为0.00，清空备注，分类重置为餐饮
      $('#btn-save').on('click', function () {
        console.log('[原型演示] 保存记账记录');
      });

      // 更多按钮
      // 点击后应实现：
      // 1. 弹出操作菜单，包含：导出记录、设置预算、记账提醒等选项
      $('#btn-more').on('click', function () {
        console.log('[原型演示] 更多操作');
      });

      // 日期切换
      // 点击左/右箭头应实现：
      // 1. 日期减/增一天
      // 2. 更新日期显示文字（如"5月13日 周二" / "5月15日 周四"）
      // 3. 同步更新下方日期行（如"2024年5月13日"）
      // 4. 如切换日期，最近记录列表应筛选为对应日期的记录
      $('#btn-date-prev').on('click', function () {
        console.log('[原型演示] 日期前移一天');
      });
      $('#btn-date-next').on('click', function () {
        console.log('[原型演示] 日期后移一天');
      });

      // 查看全部 - 跳转到账单页
      $('#link-view-all').on('click', function (e) {
        e.preventDefault();
        navReset('bills.html');
      });

      // 智能记账卡片
      // 点击后应实现：
      // 1. 弹出智能记账输入面板
      // 2. 用户输入一句话描述（如"午饭花了25"）
      // 3. AI自动解析分类、金额、备注
      // 4. 解析结果填入页面各字段，用户确认后保存
      $('#card-smart').on('click', function () {
        console.log('[原型演示] 打开智能记账 - 应弹出AI一句话记账面板');
      });

      // 收集箱卡片
      // 点击后应实现：
      // 1. 跳转到收集箱页面或弹出收集箱列表
      // 2. 展示3条待确认的记录
      // 3. 每条可确认（转为正式记录）或删除
      $('#card-inbox').on('click', function () {
        console.log('[原型演示] 打开收集箱 - 查看3条待确认记录');
      });

      // 记录项点击
      // 点击后应实现：
      // 1. 跳转到记录编辑页，传入记录ID
      // 2. 编辑页展示该记录的完整信息
      // 3. 可修改分类、金额、备注等字段
      $('#recent-records').on('click', '.record-item', function () {
        const recordId = $(this).data('id');
        console.log('[原型演示] 点击记录:', recordId);
        navPush('bills.html?record_id=' + recordId);
      });

      // TabBar 导航
      $('#nav-home').on('click', function (e) { e.preventDefault(); navReset('home.html'); });
      $('#nav-subscriptions').on('click', function (e) { e.preventDefault(); navReset('subscriptions.html'); });
      $('#nav-bills').on('click', function (e) { e.preventDefault(); navReset('bills.html'); });
      $('#nav-stats').on('click', function (e) { e.preventDefault(); navReset('stats.html'); });
      $('#nav-profile').on('click', function (e) { e.preventDefault(); navReset('profile.html'); });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
