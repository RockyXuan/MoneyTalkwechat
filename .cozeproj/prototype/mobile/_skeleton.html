<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #B8643A;
      --color-primary-container:    #E8C4A8;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #EFE6D5;
      --color-surface-container-lowest:   #F2EADB;
      --color-surface:                    #FFF8EA;
      --color-surface-container:          #F5ECDA;
      --color-surface-container-high:     #FAF2E4;
      --color-surface-container-highest:  #FFF8EA;
      /* === 文字 === */
      --color-on-surface:           #2E241A;
      --color-on-surface-variant:   #6B5D4F;
      /* === 功能色 === */
      --color-success:  #6D7B45;
      --color-error:    #C4433A;
      --color-warning:  #D4943A;
      /* === 边框 === */
      --color-outline:          #C4B89E;
      --color-outline-variant:  #D9CFBC;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.625rem;
      --radius-lg:   0.875rem;
      --radius-xl:   1.25rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 4px 12px rgba(46,36,26,0.08);
      --shadow-float:  0 10px 25px rgba(46,36,26,0.12);
      --shadow-dialog: 0 25px 50px rgba(46,36,26,0.18);
      /* === 字体 === */
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <div class="fixed bottom-0 left-0 right-0 bg-surface border-t border-outline-variant/20 z-50 safe-area-bottom">
    <div class="flex items-center justify-around py-1.5">
      <a href="home.html" class="flex flex-col items-center gap-0.5 text-primary">
        <i data-lucide="pen-line" class="w-5 h-5"></i>
        <span class="text-[10px]">记一笔</span>
      </a>
      <a href="bills.html" class="flex flex-col items-center gap-0.5 text-on-surface-variant">
        <i data-lucide="receipt" class="w-5 h-5"></i>
        <span class="text-[10px]">账单</span>
      </a>
      <a href="stats.html" class="flex flex-col items-center gap-0.5 text-on-surface-variant">
        <i data-lucide="chart-bar" class="w-5 h-5"></i>
        <span class="text-[10px]">统计</span>
      </a>
      <a href="subscriptions.html" class="flex flex-col items-center gap-0.5 text-on-surface-variant">
        <i data-lucide="repeat" class="w-5 h-5"></i>
        <span class="text-[10px]">订阅</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 text-on-surface-variant">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px]">我的</span>
      </a>
    </div>
  </div>
  <!-- @nav:end 导航组件 -->

  <main class="flex-1 pb-16">
    <!-- @main-content:start -->
    <!-- @main-content:end -->
  </main>

  <script>lucide.createIcons();</script>
</body>

</html>
