<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #2F7BFF;
      --color-primary-container:    #E8F0FE;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #F5F7FB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F0F2F5;
      --color-surface-container-high:     #E8EAED;
      --color-surface-container-highest:  #DEE1E6;
      /* === 文字 === */
      --color-on-surface:           #1A1A1A;
      --color-on-surface-variant:   #8A8A8A;
      /* === 功能色 === */
      --color-success:  #34C759;
      --color-error:    #FF3B30;
      --color-warning:  #FF9500;
      /* === 边框 === */
      --color-outline:          #E8E8E8;
      --color-outline-variant:  #F0F2F5;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 12px rgba(0,0,0,0.06);
      --shadow-float:  0 8px 24px rgba(0,0,0,0.1);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.15);
      /* === 字体 === */
      --font-sans: "PingFang SC", system-ui, -apple-system, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <!-- 浮动 TabBar -->
  <nav class="fixed bottom-4 left-3 right-3 z-50">
    <div class="bg-white rounded-2xl shadow-float flex items-center justify-around py-2 px-2">
      <a href="home.html" id="nav-home" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="pen-line" class="w-5 h-5"></i>
        <span class="text-xs">记一笔</span>
      </a>
      <a href="subscriptions.html" id="nav-subscriptions" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="credit-card" class="w-5 h-5"></i>
        <span class="text-xs">订阅</span>
      </a>
      <a href="bills.html" id="nav-bills" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="receipt" class="w-5 h-5"></i>
        <span class="text-xs">账单</span>
      </a>
      <a href="stats.html" id="nav-stats" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-on-surface-variant">
        <i data-lucide="chart-no-axes-column" class="w-5 h-5"></i>
        <span class="text-xs">统计</span>
      </a>
      <a href="profile.html" id="nav-profile" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl transition-colors text-primary bg-primary-container" aria-current="page">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-xs font-medium">我的</span>
      </a>
    </div>
  </nav>
  <!-- @nav:end 导航组件 -->

  <main class="flex-1 pb-24">
    <!-- @main-content:start -->

    <!-- 页面标题栏 -->
    <header class="flex items-center justify-between px-4 pt-4 pb-2">
      <h1 class="text-xl font-bold text-on-surface">我的</h1>
      <div class="flex items-center gap-2">
        <button id="btn-notification" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <i data-lucide="bell" class="w-5 h-5"></i>
        </button>
        <button id="btn-settings" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- 1. 顶部蓝色渐变用户卡片 -->
    <section class="mx-4 mt-2 mb-5">
      <div id="card-user" class="relative rounded-2xl p-5 overflow-hidden" style="background: linear-gradient(135deg, #2F7BFF 0%, #5B9BFF 100%);">
        <div class="flex items-center justify-between">
          <div class="flex-1">
            <h2 class="text-lg font-bold text-white">你好，小明</h2>
            <p class="text-sm text-white/70 mt-1">今日已支出 ¥86.00</p>
          </div>
          <!-- 头像圆形 -->
          <div id="avatar" class="w-14 h-14 rounded-full bg-white/20 border-2 border-white flex items-center justify-center flex-shrink-0">
            <span class="text-xl font-bold text-white">明</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 快捷统计：3个白色小卡片横排 -->
    <section class="mx-4 mb-5">
      <div class="grid grid-cols-3 gap-3">
        <!-- 统计卡片-今日支出 -->
        <div id="stat-today" class="bg-surface rounded-xl p-3 text-center shadow-card">
          <p class="text-xs text-on-surface-variant mb-1">今日支出</p>
          <p class="text-base font-bold text-on-surface">¥86</p>
        </div>
        <!-- 统计卡片-本月支出 -->
        <div id="stat-month" class="bg-surface rounded-xl p-3 text-center shadow-card">
          <p class="text-xs text-on-surface-variant mb-1">本月支出</p>
          <p class="text-base font-bold text-on-surface">¥2,856</p>
        </div>
        <!-- 统计卡片-本月记录 -->
        <div id="stat-records" class="bg-surface rounded-xl p-3 text-center shadow-card">
          <p class="text-xs text-on-surface-variant mb-1">本月记录</p>
          <p class="text-base font-bold text-on-surface">42笔</p>
        </div>
      </div>
    </section>

    <!-- 3. AI偏好设置卡片 -->
    <section class="mx-4 mb-4">
      <div id="card-ai-preference" class="bg-surface rounded-xl p-4 shadow-card">
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="sparkles" class="w-5 h-5 text-primary"></i>
              <h3 class="text-base font-semibold text-on-surface">AI 智能偏好</h3>
            </div>
            <p class="text-sm text-on-surface-variant mt-1">根据你的记账习惯，AI 会自动学习并优化分类建议</p>
          </div>
          <!-- 切换开关 -->
          <button id="toggle-ai" class="relative w-12 h-7 rounded-full bg-primary flex-shrink-0 ml-3 transition-colors" aria-label="AI智能偏好开关">
            <span id="toggle-ai-dot" class="absolute top-0.5 right-0.5 w-6 h-6 rounded-full bg-white shadow-sm transition-all"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- 4. 微信绑定卡片 -->
    <section class="mx-4 mb-5">
      <div id="card-wechat-bind" class="bg-surface rounded-xl p-4 shadow-card">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-xl bg-[#07C160]/10 flex items-center justify-center flex-shrink-0">
            <i data-lucide="message-circle" class="w-5 h-5 text-[#07C160]"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-base font-semibold text-on-surface">绑定微信公众号</h3>
            <p class="text-xs text-on-surface-variant mt-0.5">通过公众号发消息快速记账</p>
          </div>
        </div>
        <button id="btn-bind-wechat" class="mt-2 w-full bg-primary text-on-primary py-2.5 rounded-xl text-sm font-semibold hover:opacity-90 active:scale-[0.98] transition-all">
          去绑定
        </button>
      </div>
    </section>

    <!-- 5. 功能网格：2x3 -->
    <section class="mx-4 mb-5">
      <div class="grid grid-cols-3 gap-3">
        <!-- 功能网格-数据导出 -->
        <button id="func-export" class="bg-surface rounded-xl p-4 flex flex-col items-center gap-2 shadow-card hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
            <i data-lucide="download" class="w-5 h-5 text-primary"></i>
          </div>
          <span class="text-xs font-medium text-on-surface">数据导出</span>
        </button>
        <!-- 功能网格-预算管理 -->
        <button id="func-budget" class="bg-surface rounded-xl p-4 flex flex-col items-center gap-2 shadow-card hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <div class="w-10 h-10 rounded-xl bg-warning/10 flex items-center justify-center">
            <i data-lucide="wallet" class="w-5 h-5 text-warning"></i>
          </div>
          <span class="text-xs font-medium text-on-surface">预算管理</span>
        </button>
        <!-- 功能网格-账单提醒 -->
        <button id="func-reminder" class="bg-surface rounded-xl p-4 flex flex-col items-center gap-2 shadow-card hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <div class="w-10 h-10 rounded-xl bg-error/10 flex items-center justify-center">
            <i data-lucide="bell-ring" class="w-5 h-5 text-error"></i>
          </div>
          <span class="text-xs font-medium text-on-surface">账单提醒</span>
        </button>
        <!-- 功能网格-记账偏好 -->
        <button id="func-preference" class="bg-surface rounded-xl p-4 flex flex-col items-center gap-2 shadow-card hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <div class="w-10 h-10 rounded-xl bg-success/10 flex items-center justify-center">
            <i data-lucide="sliders-horizontal" class="w-5 h-5 text-success"></i>
          </div>
          <span class="text-xs font-medium text-on-surface">记账偏好</span>
        </button>
        <!-- 功能网格-关于我们 -->
        <button id="func-about" class="bg-surface rounded-xl p-4 flex flex-col items-center gap-2 shadow-card hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
            <i data-lucide="info" class="w-5 h-5 text-primary"></i>
          </div>
          <span class="text-xs font-medium text-on-surface">关于我们</span>
        </button>
        <!-- 功能网格-意见反馈 -->
        <button id="func-feedback" class="bg-surface rounded-xl p-4 flex flex-col items-center gap-2 shadow-card hover:bg-surface-container active:bg-surface-container-high transition-colors">
          <div class="w-10 h-10 rounded-xl bg-warning/10 flex items-center justify-center">
            <i data-lucide="message-square" class="w-5 h-5 text-warning"></i>
          </div>
          <span class="text-xs font-medium text-on-surface">意见反馈</span>
        </button>
      </div>
    </section>

    <!-- 6. 收集箱快捷入口 -->
    <section class="mx-4 mb-6">
      <div id="card-inbox" class="bg-surface rounded-xl p-4 shadow-card">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <i data-lucide="inbox" class="w-5 h-5 text-primary"></i>
            </div>
            <div>
              <h3 class="text-base font-semibold text-on-surface">收集箱 (3)</h3>
              <p class="text-xs text-on-surface-variant mt-0.5">3条待确认</p>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-on-surface-variant/50"></i>
        </div>
      </div>
    </section>

    <!-- @main-content:end -->
  </main>

  <script>
    // 导航辅助函数
    function navPush(route) {
      console.log('[原型演示] PUSH 到: ' + route);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log('[原型演示] REPLACE 为: ' + route);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log('[原型演示] RESET 到: ' + route);
      window.location.href = route;
    }
    function navBack() {
      console.log('[原型演示] BACK 返回上一页');
      if (window.history.length > 1) window.history.back();
    }
  </script>

  <script>
    $(function () {
      // TabBar 导航
      $('#nav-home').on('click', function (e) {
        e.preventDefault();
        navReset('home.html');
      });
      $('#nav-subscriptions').on('click', function (e) {
        e.preventDefault();
        navReset('subscriptions.html');
      });
      $('#nav-bills').on('click', function (e) {
        e.preventDefault();
        navReset('bills.html');
      });
      $('#nav-stats').on('click', function (e) {
        e.preventDefault();
        navReset('stats.html');
      });
      // 当前页 profile，不需要跳转

      // AI 偏好开关切换
      var aiEnabled = true;
      $('#toggle-ai').on('click', function () {
        aiEnabled = !aiEnabled;
        if (aiEnabled) {
          $(this).removeClass('bg-surface-container-high').addClass('bg-primary');
          $('#toggle-ai-dot').css({ right: '2px', left: 'auto' });
        } else {
          $(this).removeClass('bg-primary').addClass('bg-surface-container-high');
          $('#toggle-ai-dot').css({ right: 'auto', left: '2px' });
        }
        console.log('[原型演示] AI智能偏好开关: ' + (aiEnabled ? '开启' : '关闭'));
      });

      // 微信绑定按钮
      $('#btn-bind-wechat').on('click', function () {
        console.log('[原型演示] 跳转微信绑定流程');
        // 实际应跳转微信授权绑定页面
      });

      // 通知按钮
      $('#btn-notification').on('click', function () {
        console.log('[原型演示] 打开通知页面');
      });

      // 设置按钮
      $('#btn-settings').on('click', function () {
        console.log('[原型演示] 打开设置页面');
      });

      // 功能网格项点击
      $('#func-export').on('click', function () {
        console.log('[原型演示] 数据导出功能');
      });
      $('#func-budget').on('click', function () {
        console.log('[原型演示] 预算管理功能');
      });
      $('#func-reminder').on('click', function () {
        console.log('[原型演示] 账单提醒功能');
      });
      $('#func-preference').on('click', function () {
        console.log('[原型演示] 记账偏好功能');
      });
      $('#func-about').on('click', function () {
        console.log('[原型演示] 关于我们页面');
      });
      $('#func-feedback').on('click', function () {
        console.log('[原型演示] 意见反馈页面');
      });

      // 收集箱入口
      $('#card-inbox').on('click', function () {
        console.log('[原型演示] 进入收集箱页面');
      });

      // 用户卡片点击
      $('#card-user').on('click', function () {
        console.log('[原型演示] 进入个人资料页');
      });

      // 头像点击
      $('#avatar').on('click', function (e) {
        e.stopPropagation();
        console.log('[原型演示] 修改头像');
      });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
