<!DOCTYPE html>

<head>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #2F7BFF;
      --color-primary-container:    #E8F0FE;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #F5F7FB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F0F2F5;
      --color-surface-container-high:     #E8EAED;
      --color-surface-container-highest:  #DEE1E6;
      /* === 文字 === */
      --color-on-surface:           #1A1A1A;
      --color-on-surface-variant:   #8A8A8A;
      /* === 功能色 === */
      --color-success:  #34C759;
      --color-error:    #FF3B30;
      --color-warning:  #FF9500;
      /* === 订阅分类背景 === */
      --color-sub-entertainment:  #FFF3E0;
      --color-sub-music:          #E8F5E9;
      --color-sub-cloud:          #E3F2FD;
      --color-sub-video:          #FCE4EC;
      /* === 订阅筛选未选中 === */
      --color-chip-unselected-bg:     #FFFFFF;
      --color-chip-unselected-text:   #86909C;
      --color-chip-unselected-border: #E5E6EB;
      /* === 边框 === */
      --color-outline:          #E8E8E8;
      --color-outline-variant:  #F0F2F5;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 12px rgba(0,0,0,0.06);
      --shadow-float:  0 8px 24px rgba(0,0,0,0.1);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.15);
      /* === 字体 === */
      --font-sans: "PingFang SC", system-ui, -apple-system, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <!-- 浮动 TabBar -->
  <nav class="fixed bottom-4 left-3 right-3 z-50">

  <main class="flex-1 pb-24">

    <!-- 蓝色渐变顶部卡片 -->

      </div>
      <div class="mt-4">

    <!-- 筛选芯片 -->

      <button id="chip-active" class="filter-chip px-5 py-2 rounded-full text-sm font-medium transition-colors bg-chip-unselected-bg text-chip-unselected-text border border-chip-unselected-border" data-filter="active">

        已过期

    <!-- 订阅列表 -->
    <div id="subscription-list" class="px-4 space-y-3 mb-5">

      <!-- 列表-订阅1: 爱奇艺VIP -->
      <div class="subscription-card bg-white rounded-2xl p-4 shadow-card" data-status="active" data-id="sub-1">
        <div class="flex items-center gap-3">
          <!-- 分类emoji图标：圆形彩色背景 -->
          <div class="w-11 h-11 rounded-full flex items-center justify-center text-lg shrink-0 bg-sub-entertainment">
            🎬
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-base font-semibold text-on-surface">爱奇艺VIP</p>
            <p class="text-xs text-on-surface-variant mt-0.5">每月15日</p>
          </div>
          <p class="text-base font-semibold text-primary shrink-0">¥29.90<span class="text-xs font-normal text-on-surface-variant">/月</span></p>
        </div>
        <div class="flex items-center gap-1.5 mt-3 pt-3 border-t border-outline-variant/20">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-on-surface-variant"></i>
          <p class="text-xs text-on-surface-variant">下次扣款：6月15日</p>
        </div>
      </div>

      <!-- 列表-订阅2: Spotify会员 -->
      <div class="subscription-card bg-white rounded-2xl p-4 shadow-card" data-status="active" data-id="sub-2">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full flex items-center justify-center text-lg shrink-0 bg-sub-music">
            🎵
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-base font-semibold text-on-surface">Spotify会员</p>
            <p class="text-xs text-on-surface-variant mt-0.5">每月1日</p>
          </div>
          <p class="text-base font-semibold text-primary shrink-0">¥48.00<span class="text-xs font-normal text-on-surface-variant">/月</span></p>
        </div>
        <div class="flex items-center gap-1.5 mt-3 pt-3 border-t border-outline-variant/20">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-on-surface-variant"></i>
          <p class="text-xs text-on-surface-variant">下次扣款：6月1日</p>
        </div>
      </div>

      <!-- 列表-订阅3: iCloud 200GB -->
      <div class="subscription-card bg-white rounded-2xl p-4 shadow-card" data-status="active" data-id="sub-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full flex items-center justify-center text-lg shrink-0 bg-sub-cloud">
            ☁️
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-base font-semibold text-on-surface">iCloud 200GB</p>
            <p class="text-xs text-on-surface-variant mt-0.5">每月8日</p>
          </div>
          <p class="text-base font-semibold text-primary shrink-0">¥21.00<span class="text-xs font-normal text-on-surface-variant">/月</span></p>
        </div>
        <div class="flex items-center gap-1.5 mt-3 pt-3 border-t border-outline-variant/20">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-on-surface-variant"></i>
          <p class="text-xs text-on-surface-variant">下次扣款：6月8日</p>
        </div>
      </div>

      <!-- 列表-订阅4: Netflix标准 (已过期) -->
      <div class="subscription-card bg-white rounded-2xl p-4 shadow-card" data-status="expired" data-id="sub-4">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full flex items-center justify-center text-lg shrink-0 bg-sub-video">
            📺
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-base font-semibold text-on-surface">Netflix标准</p>
            <p class="text-xs text-on-surface-variant mt-0.5">每月20日</p>
          </div>
          <p class="text-base font-semibold text-on-surface-variant shrink-0 line-through">¥89.00<span class="text-xs font-normal">/月</span></p>
        </div>
        <div class="flex items-center gap-1.5 mt-3 pt-3 border-t border-outline-variant/20">

          <p class="text-xs text-error">已过期 · 5月20日未续费</p>
        </div>

    </div>

    <!-- 订阅识别功能卡片 -->
    <div class="mx-4 mb-6 rounded-2xl p-4 flex items-center gap-3 bg-primary-container">

        <i data-lucide="sparkles" class="w-5 h-5 text-primary"></i>
      </div>
      <div class="flex-1">
        <p class="text-sm font-semibold text-on-surface">拍照识别订阅账单</p>
        <p class="text-xs text-on-surface-variant mt-0.5">自动添加追踪</p>

  <script>
    // 导航辅助函数
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    $(function () {
      // TabBar 导航切换（使用 navReset）
      $('#nav-home').on('click', function (e) {
        e.preventDefault();
        navReset('home.html');
      });
      $('#nav-subscriptions').on('click', function (e) {
        e.preventDefault();
        navReset('subscriptions.html');
      });
      $('#nav-bills').on('click', function (e) {
        e.preventDefault();
        navReset('bills.html');
      });
      $('#nav-stats').on('click', function (e) {
        e.preventDefault();
        navReset('stats.html');
      });
      $('#nav-profile').on('click', function (e) {
        e.preventDefault();
        navReset('profile.html');
      });

      // 筛选芯片切换
      $('#filter-chips').on('click', '.filter-chip', function () {
        var filter = $(this).data('filter');

        // 更新芯片样式
        $('.filter-chip').removeClass('bg-primary text-white').addClass('bg-chip-unselected-bg text-chip-unselected-text border border-chip-unselected-border');
        $(this).removeClass('bg-chip-unselected-bg text-chip-unselected-text border border-chip-unselected-border').addClass('bg-primary text-white');

        // 根据筛选条件显示/隐藏订阅卡片
        if (filter === 'all') {
          $('.subscription-card').show();
        } else if (filter === 'active') {
          $('.subscription-card[data-status="active"]').show();
          $('.subscription-card[data-status="expired"]').hide();
        } else if (filter === 'expired') {
          $('.subscription-card[data-status="active"]').hide();
          $('.subscription-card[data-status="expired"]').show();
        }
      });

      // 添加订阅按钮
      // 点击后应实现：
      // 1. 弹出底部模态框，包含订阅名称输入框、金额输入框、扣款周期选择器、首次扣款日期选择器
      // 2. 填写完成后点击确认，在订阅列表顶部添加一张新的订阅卡片
      // 3. 同时更新顶部卡片中的活跃订阅数和月度总支出金额
      $('#btn-add-subscription').on('click', function () {
        console.log('添加订阅 - 应弹出添加订阅表单模态框');
      });

      // 顶部更多按钮（同添加功能）
      $('#btn-header-more').on('click', function () {
        console.log('添加订阅 - 从标题栏入口');
      });

      // 订阅卡片点击
      // 点击后应实现：
      // 1. 跳转到订阅详情页，展示完整订阅信息
      // 2. 详情页包含：订阅名称、金额、扣款周期、首次扣款日期、下次扣款日期、已扣款历史记录
      // 3. 支持编辑和取消订阅操作
      $('#subscription-list').on('click', '.subscription-card', function () {
        var subId = $(this).data('id');
        console.log('查看订阅详情:', subId);
      });

      // 拍照识别订阅账单
      // 需要调用第三方接口实现相机拍照功能：
      // 1. 调起手机相机，用户拍摄订阅账单截图或邮件截图
      // 2. AI 识别账单中的订阅服务名称、金额、扣款周期等信息
      // 3. 自动填充到添加订阅表单中，用户确认后创建订阅记录
      $('#btn-scan-bill').on('click', function () {
        console.log('需要调用第三方接口实现相机拍照识别订阅账单功能');
      });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>
