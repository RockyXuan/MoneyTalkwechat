<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyTalk · 记账首页方案</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4ee;color:#183b35;font:16px/1.65 system-ui}header,main{max-width:960px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bbc7be}header b{font: bold 28px Georgia}button,textarea{font:inherit}button{background:white;color:inherit;border:1px solid #acb9ae;border-radius:9px;padding:8px 14px;cursor:pointer}button[aria-pressed=true],.primary{background:#195344;color:white}nav{display:flex;gap:8px;flex-wrap:wrap}h1{font-size:clamp(29px,5vw,48px);margin:20px 0}h2{font-size:20px;margin:0 0 12px}.grid{display:grid;grid-template-columns:3fr 2fr;gap:16px}.card{background:#fff;border:1px solid #d4dcd2;padding:22px;border-radius:14px}.focus .grid{grid-template-columns:1fr}.focus aside{background:#e3ece2}.resume aside{order:-1}.resume .grid{grid-template-columns:2fr 3fr}textarea{display:block;width:100%;height:120px;padding:12px;border-radius:8px;border:1px solid #899c90;margin:10px 0}small{color:#506258}output{display:block;margin-top:12px}details{margin-top:12px}summary{cursor:pointer}@media(max-width:650px){.grid,.resume .grid{grid-template-columns:1fr}main{padding:16px}.card{padding:16px}} </style>
<header><b>MoneyTalk</b><small>交互样稿 · 虚构账本</small></header><main class="focus"><nav aria-label="选择首页方案"><button aria-pressed="true" data-layout="focus">A 专注录入</button><button aria-pressed="false" data-layout="resume">B 优先续记</button><button aria-pressed="false" data-layout="both">C 并排核对</button></nav><h1>记一笔</h1><div class="grid"><section class="card"><h2><label for="draft">消费记录</label></h2><textarea id="draft" readonly>11 月 18 日，午餐 28 元。</textarea><button class="primary" id="preview">预览示例</button><output id="candidate" aria-live="polite"></output></section><aside class="card"><h2>接着上次记</h2><b>淘宝 · 11 月</b><p>已说到收纳盒<br>已连续确认到笔记本</p><details><summary>继续核对 · 还差 1 笔</summary><p>收纳盒 · ¥19.00<br>日期只记到 11 月，分类待选。</p></details></aside></div></main><script>
const main=document.querySelector('main');
document.querySelector('nav').onclick=e=>{if(!e.target.dataset.layout)return;main.className=e.target.dataset.layout;for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(b===e.target))};
document.querySelector('#preview').onclick=()=>{document.querySelector('#candidate').textContent='待确认　11 月 18 日 · 午餐 · ¥28.00　｜　尚未入账'};
</script></html>
